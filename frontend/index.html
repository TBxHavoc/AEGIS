<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#03080c"><title>AEGIS</title>
<style>
:root{color-scheme:dark;--cyan:#b9f4ff;--blue:#3cd9ff;--red:#ff4d62;--bg:#03080c}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif}#stage{position:relative;width:min(92vmin,760px);aspect-ratio:1;display:grid;place-items:center}#visualizer{position:absolute;inset:0;width:100%;height:100%}#core{position:relative;width:48%;aspect-ratio:1;display:grid;place-items:center;border:1px solid rgba(185,244,255,.76);border-radius:50%;background:rgba(3,8,12,.88);box-shadow:0 0 18px rgba(60,217,255,.22),inset 0 0 34px rgba(60,217,255,.07);transition:border-color .35s,box-shadow .35s,transform .35s}#name{color:#e8fbff;font-size:clamp(24px,7vmin,62px);font-weight:300;letter-spacing:.2em;padding-left:.2em;text-shadow:0 0 10px rgba(185,244,255,.65);user-select:none}#stage[data-phase=listening] #core{border-color:var(--blue);box-shadow:0 0 28px rgba(60,217,255,.55),inset 0 0 38px rgba(60,217,255,.12);animation:listen 2.2s ease-in-out infinite}#stage[data-phase=processing] #core{border-color:#9b8cff;box-shadow:0 0 30px rgba(155,140,255,.52),inset 0 0 36px rgba(155,140,255,.12);animation:process 1.5s linear infinite}#stage[data-phase=speaking] #core{border-color:#f4ffff;box-shadow:0 0 34px rgba(185,244,255,.72),inset 0 0 42px rgba(185,244,255,.16);animation:speak .8s ease-in-out infinite alternate}#stage[data-phase=disabled] #core{border-color:rgba(255,77,98,.82);box-shadow:0 0 18px rgba(255,77,98,.25),inset 0 0 30px rgba(255,77,98,.08);animation:disabled 3s ease-in-out infinite}@keyframes listen{0%,100%{transform:scale(.98)}50%{transform:scale(1.025)}}@keyframes process{to{transform:rotate(360deg)}}@keyframes speak{to{transform:scale(1.045)}}@keyframes disabled{0%,100%{opacity:.72}50%{opacity:1}}@media(prefers-reduced-motion:reduce){#core{animation:none!important}}#microphone{position:fixed;right:clamp(18px,4vw,48px);bottom:clamp(18px,4vw,42px);width:46px;height:46px;border:1px solid rgba(185,244,255,.5);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--cyan);background:rgba(3,8,12,.72);cursor:pointer;transition:color .2s,border-color .2s,box-shadow .2s}#microphone:hover,#microphone:focus-visible{border-color:var(--cyan);box-shadow:0 0 16px rgba(60,217,255,.35);outline:none}#microphone[aria-pressed=true]{color:var(--blue);border-color:var(--blue);box-shadow:0 0 16px rgba(60,217,255,.32)}#microphone[aria-pressed=false]{color:var(--red);border-color:rgba(255,77,98,.8);box-shadow:0 0 14px rgba(255,77,98,.2)}#microphone svg{width:20px;height:20px;fill:currentColor}#composer{position:fixed;left:50%;bottom:clamp(18px,4vw,42px);transform:translateX(-50%);width:min(90vw,560px);display:flex;gap:8px}#composer[hidden]{display:none}#composer input{min-width:0;flex:1;color:var(--cyan);background:rgba(3,8,12,.82);border:1px solid rgba(185,244,255,.34);border-radius:999px;padding:11px 16px;font:inherit}#composer input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 14px rgba(60,217,255,.16)}#composer button{color:#001016;background:var(--cyan);border:0;border-radius:999px;padding:0 18px;font:inherit;cursor:pointer}#composer button:disabled{opacity:.42;cursor:not-allowed}#terminal{position:fixed;left:50%;top:7vh;transform:translateX(-50%);width:min(88vw,680px);max-height:24vh;overflow:auto;color:#b8eaf3;background:rgba(3,8,12,.86);border-left:2px solid rgba(185,244,255,.58);padding:10px 14px;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}#terminal[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head>
<body>
<main id="stage" data-phase="disabled" aria-label="AEGIS voice assistant"><canvas id="visualizer" aria-hidden="true"></canvas><div id="core"><div id="name">AEGIS</div></div></main>
<button id="microphone" type="button" aria-label="Enable microphone" aria-pressed="false" title="Enable microphone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Zm6-3.5a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.91V20H8a1 1 0 0 0 0 2h8a1 1 0 0 0 0-2h-3v-3.09A6 6 0 0 0 18 11Z"/></svg></button>
<form id="composer" hidden aria-label="Text message"><input id="message-input" maxlength="4000" autocomplete="off" placeholder="Type a message…" aria-label="Message"><button id="send-button" type="submit">Send</button></form>
<output id="terminal" hidden aria-live="polite"></output><div id="status" class="sr-only" aria-live="polite">Microphone disabled. Text input available.</div>
<script>
(()=>{"use strict";const stage=document.getElementById("stage"),canvas=document.getElementById("visualizer"),ctx=canvas.getContext("2d",{alpha:true}),micButton=document.getElementById("microphone"),composer=document.getElementById("composer"),input=document.getElementById("message-input"),sendButton=document.getElementById("send-button"),terminal=document.getElementById("terminal"),status=document.getElementById("status"),bars=96,levels=new Float32Array(bars),rawFetch=window.fetch.bind(window);let apiToken=sessionStorage.getItem("aegisApiToken")||"",width=0,height=0,ratio=1,phase="disabled",micEnabled=false,mediaStream=null,audioContext=null,processor=null,sourceNode=null,chatSocket=null,bridgeSocket=null,requestPending=false,activeResponseText="",terminalRequested=false,reconnectTimer=null,audioActive=false,speechMs=0,silenceMs=0,lastChunk=0,audioRequestId="",speechSamples=0,bargePending=false,vadThreshold=.018,vadMinimum=240,vadSilence=1100,vadMaximum=30000,ttsActive=false,ttsBargeMs=0;
window.fetch=(resource,options={})=>{const headers=new Headers(options.headers||{});if(apiToken)headers.set("Authorization",`Bearer ${apiToken}`);return rawFetch(resource,{...options,headers})};async function initializeAuth(){let response=await rawFetch("/api/health");if(response.status===401){apiToken=prompt("Enter your local AEGIS API token")||"";if(apiToken){sessionStorage.setItem("aegisApiToken",apiToken);response=await rawFetch("/api/health",{headers:{Authorization:`Bearer ${apiToken}`}})}}if(!response.ok){announce("AEGIS API authentication is required. Reload after entering a valid token.");return false}return true}
function resize(){const rect=canvas.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,1.5);width=rect.width;height=rect.height;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)}function setPhase(next){phase=next;stage.dataset.phase=next}function announce(text){status.textContent=text}function updateMicButton(){micButton.setAttribute("aria-pressed",String(micEnabled));micButton.setAttribute("aria-label",micEnabled?"Disable microphone":"Enable microphone");micButton.title=micEnabled?"Disable microphone":"Enable microphone";composer.hidden=micEnabled;if(!micEnabled&&!requestPending)setPhase("disabled")}function requestWantsText(text){return /\b(show|display|write|written|text)\b.{0,40}\b(response|answer|reply)\b/i.test(text)}
function wsSend(type,payload={},id=null){if(!chatSocket||chatSocket.readyState!==WebSocket.OPEN)return false;chatSocket.send(JSON.stringify({type,request_id:id||`${Date.now()}-${Math.random().toString(16).slice(2)}`,payload}));return true}function stopAudioCapture(){audioActive=false;speechMs=0;silenceMs=0;if(processor){processor.disconnect();processor.onaudioprocess=null;processor=null}if(sourceNode){sourceNode.disconnect();sourceNode=null}if(audioContext){audioContext.close();audioContext=null}}
function pcmBytes(floatData,inputRate){const ratio=inputRate/16000,length=Math.floor(floatData.length/ratio),out=new Int16Array(length);for(let i=0;i<length;i++){const from=Math.floor(i*ratio),to=Math.min(floatData.length,Math.floor((i+1)*ratio));let sum=0;for(let j=from;j<to;j++)sum+=floatData[j];const sample=Math.max(-1,Math.min(1,sum/Math.max(1,to-from)));out[i]=sample<0?sample*32768:sample*32767}return new Uint8Array(out.buffer)}function b64(bytes){let binary="";for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(bytes.length,i+8192)));return btoa(binary)}function stopSegment(){if(!audioActive)return;audioRequestId=`voice-${Date.now()}-${Math.random().toString(16).slice(2)}`;wsSend("audio.session.end",{},audioRequestId);audioActive=false;speechMs=0;silenceMs=0;requestPending=true;setPhase("processing");announce("Processing speech")}
function startCapture(){if(!micEnabled||!mediaStream||processor)return;try{audioContext=new(window.AudioContext||window.webkitAudioContext)();sourceNode=audioContext.createMediaStreamSource(mediaStream);processor=audioContext.createScriptProcessor(4096,1,1);processor.onaudioprocess=event=>{if(!micEnabled)return;const raw=event.inputBuffer.getChannelData(0),pcm=pcmBytes(raw,audioContext.sampleRate);let energy=0;for(let i=0;i<raw.length;i++)energy+=raw[i]*raw[i];const rms=Math.sqrt(energy/raw.length),duration=raw.length/audioContext.sampleRate*1000,voiced=rms>vadThreshold;if(ttsActive){if(rms>.09){ttsBargeMs+=duration;if(ttsBargeMs>=vadMinimum){wsSend("conversation.response.interrupt",{request_id:audioRequestId});fetch("/api/voice/stop",{method:"POST"}).catch(()=>{});ttsActive=false;requestPending=false;ttsBargeMs=0}}else ttsBargeMs=0;if(ttsActive)return}if(requestPending){if(voiced&&!bargePending){bargePending=true;wsSend("conversation.response.interrupt",{request_id:audioRequestId});fetch("/api/voice/stop",{method:"POST"}).catch(()=>{});requestPending=false;setPhase("listening");announce("Listening")};if(!bargePending)return}if(voiced){silenceMs=0;speechMs+=duration;if(!audioActive){audioActive=wsSend("audio.session.start");if(audioActive){audioRequestId=`voice-${Date.now()}-${Math.random().toString(16).slice(2)}`;speechSamples=0;setPhase("listening")}}}else if(audioActive)silenceMs+=duration;if(audioActive){wsSend("audio.chunk",{pcm16:b64(pcm)});speechSamples+=pcm.length/2;if(silenceMs>=vadSilence&&speechMs>=vadMinimum){stopSegment();bargePending=false}else if(speechSamples>=16000*vadMaximum/1000){stopSegment();bargePending=false}}};sourceNode.connect(processor);processor.connect(audioContext.destination);setPhase("listening");announce("Listening") }catch(error){announce(`Audio capture failed: ${error.message||"unsupported browser"}`);stopAudioCapture()}}
async function setMicrophone(enabled){if(!enabled){micEnabled=false;wsSend("audio.session.cancel");stopAudioCapture();if(mediaStream){for(const track of mediaStream.getTracks())track.stop();mediaStream=null}updateMicButton();try{await backendMic(false)}catch(_){}announce("Microphone disabled. Text input available.");return}if(!navigator.mediaDevices?.getUserMedia){announce("Microphone permission is unavailable in this browser.");return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});const health=await fetch("/api/status").then(response=>response.json()),vad=health.stt?.vad||{};vadThreshold=vad.threshold??vadThreshold;vadMinimum=vad.minimum_speech_ms??vadMinimum;vadSilence=vad.silence_ms??vadSilence;vadMaximum=vad.max_recording_ms??vadMaximum;await backendMic(true);micEnabled=true;updateMicButton();if(chatSocket?.readyState===WebSocket.OPEN)startCapture();if(!health.stt?.available)announce("Microphone active. Local STT is not configured yet.")}catch(error){stopAudioCapture();if(mediaStream){for(const track of mediaStream.getTracks())track.stop();mediaStream=null}micEnabled=false;updateMicButton();setPhase("disabled");announce(`Microphone unavailable: ${error.message||"permission denied"}. Text input available.`)}}
async function monitorVoice(){for(let i=0;i<120;i+=1){try{const response=await fetch("/api/voice/status");const value=await response.json();if(value.speaking||value.synthesizing){ttsActive=Boolean(value.speaking);setPhase(value.speaking?"speaking":"processing");await new Promise(resolve=>setTimeout(resolve,250));continue}}catch(_){}ttsActive=false;if(!requestPending){setPhase(micEnabled?"listening":"disabled");return}}ttsActive=false;if(!requestPending)setPhase(micEnabled?"listening":"disabled")}
function sendMessage(text,source="text"){if(!text||requestPending||!chatSocket||chatSocket.readyState!==WebSocket.OPEN)return false;requestPending=true;activeResponseText="";terminalRequested=requestWantsText(text);setPhase("processing");sendButton.disabled=true;const requestId=`${Date.now()}-${Math.random().toString(16).slice(2)}`;chatSocket.send(JSON.stringify({type:"conversation.message",request_id:requestId,payload:{message:text,source}}));input.value="";return true}
function connectChat(){const scheme=location.protocol==="https:"?"wss":"ws",protocols=apiToken?["aegis",`bearer.${apiToken}`]:["aegis"];chatSocket=new WebSocket(`${scheme}://${location.host}/api/ws`,protocols);chatSocket.addEventListener("open",()=>{sendButton.disabled=false;if(micEnabled&&!processor)startCapture();announce(micEnabled?"Connected. Listening when active.":"Connected. Microphone disabled. Text input available.")});chatSocket.addEventListener("close",()=>{stopAudioCapture();sendButton.disabled=true;if(!requestPending)setPhase(micEnabled?"listening":"disabled");clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connectChat,2000)});chatSocket.addEventListener("error",()=>announce("Backend connection unavailable."));chatSocket.addEventListener("message",event=>{let message;try{message=JSON.parse(event.data)}catch(_){return}if(message.type==="conversation.response.started")setPhase("processing");if(message.type==="conversation.response.chunk")activeResponseText+=message.payload?.text||"";if(message.type==="conversation.response.completed"){requestPending=false;sendButton.disabled=false;if(terminalRequested){terminal.hidden=false;terminal.textContent=activeResponseText}monitorVoice()}if(message.type==="conversation.response.failed"){requestPending=false;sendButton.disabled=false;activeResponseText="";announce(message.payload?.error==="inference_not_configured"?"No inference provider is configured.":message.payload?.error==="transcription_unavailable"?"Local speech recognition is not configured or failed.":"The request could not be completed.");setPhase(micEnabled?"listening":"disabled")}})}
function connectBridge(){try{bridgeSocket=new WebSocket("ws://127.0.0.1:8765");bridgeSocket.addEventListener("message",event=>{try{const value=JSON.parse(event.data);if(typeof value.speaking==="boolean"&&value.speaking)setPhase("speaking")}catch(_){}});bridgeSocket.addEventListener("close",()=>setTimeout(connectBridge,2000))}catch(_){setTimeout(connectBridge,2000)}}
function levelFor(index,time){const base=.035+.018*(.5+.5*Math.sin(time*.0015+index*.24));const active=phase==="listening"?.11+.08*Math.sin(time*.003)**2:phase==="processing"?.18+.1*Math.sin(time*.006+index)**2:phase==="speaking"?.22+.25*Math.sin(time*.012+index*.3)**2:0;return base+Math.max(0,active)}function draw(time){ctx.clearRect(0,0,width,height);const cx=width/2,cy=height/2,radius=width*.255;for(let i=0;i<bars;i+=1){const angle=i/bars*Math.PI*2,level=levelFor(i,time),inner=radius+width*.01,outer=inner+width*(.012+level*.095);ctx.beginPath();ctx.moveTo(cx+Math.cos(angle)*inner,cy+Math.sin(angle)*inner);ctx.lineTo(cx+Math.cos(angle)*outer,cy+Math.sin(angle)*outer);ctx.lineWidth=i%12===0?1.8:1.1;ctx.strokeStyle=phase==="disabled"?`rgba(255,77,98,${.28+level})`:`rgba(185,244,255,${.38+level})`;ctx.stroke()}requestAnimationFrame(draw)}
micButton.addEventListener("click",()=>setMicrophone(!micEnabled));composer.addEventListener("submit",event=>{event.preventDefault();sendMessage(input.value.trim())});input.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();composer.requestSubmit()}});window.addEventListener("resize",resize);window.addEventListener("pagehide",()=>{stopMedia();if(bridgeSocket)bridgeSocket.close();if(chatSocket)chatSocket.close()});resize();updateMicButton();initializeAuth().then(ok=>{if(ok)connectChat()});connectBridge();requestAnimationFrame(draw)})();
</script></body></html>
